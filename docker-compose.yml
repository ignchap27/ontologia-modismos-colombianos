# Fuseki con tres servicios sobre los mismos datos y la página web
#
#   docker compose up -d --build   prende todo y compila la página, Fuseki tarda un poco en cargar los archivos
#   docker compose down             lo apaga
#
# Fuseki queda en http://localhost:3030 con usuario admin y clave admin
# La página queda en http://localhost:8000

services:
  fuseki:
    image: stain/jena-fuseki:4.8.0
    container_name: modcol-fuseki
    ports:
      - "3030:3030"
    environment:
      ADMIN_PASSWORD: admin
      JVM_ARGS: -Xmx4g
    volumes:
      - ./fuseki:/fuseki/configuration
      - ./ontologia:/staging/ontologia:ro
      - ./datos:/staging/datos:ro

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: modcol-web
    ports:
      - "8000:80"
